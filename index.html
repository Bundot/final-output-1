<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tic-Tac-Toe</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="game-container">
    <h1>Tic-Tac-Toe</h1>
    <div class="status-banner" id="statusText">Player X's Turn</div>
       <div class="scoreboard">
      <div class="score-card player-x"><span class="label">Player X</span><span class="score" id="scoreX">0</span></div>
      <div class="score-card ties"><span class="label">Ties</span><span class="score" id="scoreTie">0</span></div>
      <div class="score-card player-o"><span class="label">Player O</span><span class="score" id="scoreO">0</span></div>
    </div>
        <div class="board" id="board">
      <div class="cell" data-index="0"></div><div class="cell" data-index="1"></div><div class="cell" data-index="2"></div>
      <div class="cell" data-index="3"></div><div class="cell" data-index="4"></div><div class="cell" data-index="5"></div>
      <div class="cell" data-index="6"></div><div class="cell" data-index="7"></div><div class="cell" data-index="8"></div>
    </div>
    <div class="controls">
      <button id="resetRoundBtn" class="btn primary">Next Round</button>
      <button id="resetGameBtn" class="btn secondary">Reset Game</button>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
